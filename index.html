<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Exam Portal</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fb;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* MAIN CONTAINER */

.container {
    width: 100%;
    max-width: 900px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    color: #17365d;
    font-size: 32px;
}

.header p {
    margin: 8px 0 0;
    color: #666;
    font-size: 15px;
}

/* LOGIN AREA */

.login-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* CARD */

.login-card {
    background: white;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    border: 1px solid #e1e6ed;
}

/* CARD HEADER */

.card-header {
    text-align: center;
    margin-bottom: 22px;
}

.icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 12px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
}

.student-icon {
    background: #e8f1ff;
}

.admin-icon {
    background: #fff0df;
}

.card-header h2 {
    margin: 5px 0;
    color: #222;
}

.card-header p {
    margin: 5px 0;
    font-size: 13px;
    color: #777;
}

/* FORM */

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    color: #333;
    font-size: 14px;
}

input {
    width: 100%;
    height: 45px;
    border: 1px solid #cbd3df;
    border-radius: 8px;
    padding: 0 13px;
    font-size: 15px;
    margin-bottom: 17px;
    outline: none;
}

input:focus {
    border-color: #2463d4;
    box-shadow: 0 0 0 3px rgba(36,99,212,0.10);
}

/* LOGIN BUTTON */

.login-button {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.student-button {
    background: #2463d4;
}

.student-button:hover {
    background: #1b4fae;
}

.admin-button {
    background: #e67e22;
}

.admin-button:hover {
    background: #c9630c;
}

/* MESSAGE */

.message {
    display: none;
    margin-top: 15px;
    padding: 11px;
    border-radius: 7px;
    font-size: 14px;
    text-align: center;
}

.message.error {
    display: block;
    background: #ffe9e9;
    border: 1px solid #ffcaca;
    color: #b42318;
}

.message.success {
    display: block;
    background: #e9f8ef;
    border: 1px solid #bce8ca;
    color: #18733a;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 20px;
    color: #888;
    font-size: 13px;
}


/* MOBILE */

@media (max-width: 700px) {

    body {
        align-items: flex-start;
        padding: 15px;
    }

    .container {
        margin-top: 15px;
    }

    .header h1 {
        font-size: 25px;
    }

    .login-area {
        grid-template-columns: 1fr;
    }

    .login-card {
        padding: 23px 20px;
    }

}

</style>
</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>Online Exam Portal</h1>

        <p>
            Select your login type to continue
        </p>

    </div>


    <!-- SIDE BY SIDE LOGIN -->

    <div class="login-area">


        <!-- =========================
             STUDENT LOGIN
        ========================== -->

        <div class="login-card">

            <div class="card-header">

                <div class="icon student-icon">
                    🎓
                </div>

                <h2>Student Login</h2>

                <p>
                    Login to access your examination dashboard
                </p>

            </div>


            <form id="studentLoginForm">

                <label for="studentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter Student ID"
                    autocomplete="username"
                    required
                >


                <label for="studentPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="studentPassword"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    id="studentLoginButton"
                    class="login-button student-button"
                >
                    Login as Student
                </button>


                <div
                    id="studentMessage"
                    class="message"
                ></div>

            </form>

        </div>



        <!-- =========================
             ADMIN LOGIN
        ========================== -->

        <div class="login-card">

            <div class="card-header">

                <div class="icon admin-icon">
                    👨‍💼
                </div>

                <h2>Admin Login</h2>

                <p>
                    Login to manage the examination portal
                </p>

            </div>


            <form id="adminLoginForm">

                <label for="adminId">
                    Admin ID
                </label>

                <input
                    type="text"
                    id="adminId"
                    placeholder="Enter Admin ID"
                    autocomplete="username"
                    required
                >


                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    id="adminLoginButton"
                    class="login-button admin-button"
                >
                    Login as Admin
                </button>


                <div
                    id="adminMessage"
                    class="message"
                ></div>

            </form>

        </div>

    </div>


    <div class="footer">
        Online Examination System
    </div>

</div>



<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxdzpQvRDFD8aoVanwPostU_19pTIjy_ruHwsLZ8slCjox831OxRNWfH94oXSsV_5ctUA/exec";


/* =====================================================
   API FUNCTION
===================================================== */

async function api(action, data = {}) {

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify({
                action: action,
                ...data
            })

        });


        const text = await response.text();


        let result;

        try {

            result = JSON.parse(text);

        } catch (error) {

            console.error("Server response:", text);

            return {
                success: false,
                message: "Invalid response from server."
            };

        }


        return result;

    } catch (error) {

        console.error("API Error:", error);

        return {
            success: false,
            message: "Unable to connect to server."
        };

    }

}


/* =====================================================
   MESSAGE FUNCTION
===================================================== */

function showMessage(id, message, type) {

    const element = document.getElementById(id);

    element.textContent = message;

    element.className = "message " + type;

}


/* =====================================================
   STUDENT LOGIN
===================================================== */

document
.getElementById("studentLoginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const studentId =
        document.getElementById("studentId")
        .value
        .trim();


    const password =
        document.getElementById("studentPassword")
        .value;


    const button =
        document.getElementById("studentLoginButton");


    if (!studentId || !password) {

        showMessage(
            "studentMessage",
            "Please enter Student ID and Password.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent = "Logging in...";


    showMessage(
        "studentMessage",
        "Checking login...",
        "success"
    );


    const result = await api(
        "studentLogin",
        {
            studentId: studentId,
            password: password
        }
    );


    console.log("Student Login:", result);


    if (result && result.success) {


        /* Clear old login data */

        sessionStorage.removeItem("examPortalRole");
        sessionStorage.removeItem("studentId");
        sessionStorage.removeItem("studentName");


        /* Save student login */

        sessionStorage.setItem(
            "examPortalRole",
            "student"
        );


        sessionStorage.setItem(
            "studentId",
            result.studentId || studentId
        );


        sessionStorage.setItem(
            "studentName",
            result.studentName || ""
        );


        showMessage(
            "studentMessage",
            "Login successful. Opening dashboard...",
            "success"
        );


        setTimeout(function() {

            window.location.href = "student.html";

        }, 500);


    } else {


        showMessage(
            "studentMessage",
            result && result.message
                ? result.message
                : "Invalid Student ID or password.",
            "error"
        );


        button.disabled = false;

        button.textContent = "Login as Student";

    }

});


/* =====================================================
   ADMIN LOGIN
===================================================== */

document
.getElementById("adminLoginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const adminId =
        document.getElementById("adminId")
        .value
        .trim();


    const password =
        document.getElementById("adminPassword")
        .value;


    const button =
        document.getElementById("adminLoginButton");


    if (!adminId || !password) {

        showMessage(
            "adminMessage",
            "Please enter Admin ID and Password.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent = "Logging in...";


    showMessage(
        "adminMessage",
        "Checking login...",
        "success"
    );


    const result = await api(
        "adminLogin",
        {
            adminId: adminId,
            password: password
        }
    );


    console.log("Admin Login:", result);


    if (result && result.success) {


        /* Clear old login data */

        sessionStorage.removeItem("examPortalRole");
        sessionStorage.removeItem("adminId");


        /* Save admin login */

        sessionStorage.setItem(
            "examPortalRole",
            "admin"
        );


        sessionStorage.setItem(
            "adminId",
            result.adminId || adminId
        );


        showMessage(
            "adminMessage",
            "Login successful. Opening dashboard...",
            "success"
        );


        setTimeout(function() {

            window.location.href = "admin.html";

        }, 500);


    } else {


        showMessage(
            "adminMessage",
            result && result.message
                ? result.message
                : "Invalid Admin ID or password.",
            "error"
        );


        button.disabled = false;

        button.textContent = "Login as Admin";

    }

});


/* =====================================================
   AUTO FOCUS
===================================================== */

window.addEventListener("load", function() {

    document
        .getElementById("studentId")
        .focus();

});

</script>

</body>
</html>
