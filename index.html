<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Exam Portal - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 900px;
  padding: 20px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  color: #1d3557;
  font-size: 30px;
}

.header p {
  margin-top: 8px;
  color: #666;
}

.login-area {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 28px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

.card h2 {
  text-align: center;
  margin-top: 0;
  margin-bottom: 22px;
}

.student-card h2 {
  color: #1565c0;
}

.admin-card h2 {
  color: #6a1b9a;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
  color: #333;
}

input {
  width: 100%;
  padding: 13px;
  margin-bottom: 17px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #1565c0;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  cursor: pointer;
}

.student-btn {
  background: #1565c0;
}

.student-btn:hover {
  background: #0d47a1;
}

.admin-btn {
  background: #6a1b9a;
}

.admin-btn:hover {
  background: #4a148c;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 11px;
  border-radius: 6px;
  font-size: 14px;
  text-align: center;
}

.error {
  display: block;
  background: #ffebee;
  color: #c62828;
}

.success {
  display: block;
  background: #e8f5e9;
  color: #2e7d32;
}

.loading {
  text-align: center;
  margin-top: 12px;
  color: #555;
  display: none;
}

.footer {
  text-align: center;
  margin-top: 25px;
  color: #777;
  font-size: 13px;
}

@media (max-width: 700px) {

  .login-area {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 25px;
  }

  .card {
    padding: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Online Exam Portal</h1>
    <p>Login to continue</p>
  </div>


  <div class="login-area">

    <!-- =========================
         STUDENT LOGIN
    ========================== -->

    <div class="card student-card">

      <h2>Student Login</h2>

      <form id="studentLoginForm">

        <label for="studentId">
          Student ID
        </label>

        <input
          type="text"
          id="studentId"
          placeholder="Enter Student ID"
          autocomplete="username"
          required
        >


        <label for="studentPassword">
          Password
        </label>

        <input
          type="password"
          id="studentPassword"
          placeholder="Enter Password"
          autocomplete="current-password"
          required
        >


        <button
          type="submit"
          id="studentLoginButton"
          class="student-btn"
        >
          Student Login
        </button>

      </form>

      <div
        id="studentLoading"
        class="loading"
      >
        Checking Student ID...
      </div>

      <div
        id="studentMessage"
        class="message"
      ></div>

    </div>


    <!-- =========================
         ADMIN LOGIN
    ========================== -->

    <div class="card admin-card">

      <h2>Admin Login</h2>

      <form id="adminLoginForm">

        <label for="adminId">
          Admin ID
        </label>

        <input
          type="text"
          id="adminId"
          placeholder="Enter Admin ID"
          autocomplete="username"
          required
        >


        <label for="adminPassword">
          Password
        </label>

        <input
          type="password"
          id="adminPassword"
          placeholder="Enter Admin Password"
          autocomplete="current-password"
          required
        >


        <button
          type="submit"
          id="adminLoginButton"
          class="admin-btn"
        >
          Admin Login
        </button>

      </form>

      <div
        id="adminLoading"
        class="loading"
      >
        Checking Admin Login...
      </div>

      <div
        id="adminMessage"
        class="message"
      ></div>

    </div>

  </div>


  <div class="footer">
    Online Exam Portal
  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxdzpQvRDFD8aoVanwPostU_19pTIjy_ruHwsLZ8slCjox831OxRNWfH94oXSsV_5ctUA/exec";


/* =====================================================
   COMMON API FUNCTION
===================================================== */

async function api(action, data = {}) {

  const response = await fetch(API_URL, {

    method: "POST",

    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },

    body: JSON.stringify({

      action: action,

      ...data

    })

  });


  const text = await response.text();

  let result;

  try {

    result = JSON.parse(text);

  } catch (error) {

    throw new Error(
      "Invalid response from Google Apps Script."
    );

  }


  return result;

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(elementId, message, type) {

  const element =
    document.getElementById(elementId);

  element.textContent = message;

  element.className =
    "message " + type;

}


/* =====================================================
   STUDENT LOGIN
===================================================== */

document
  .getElementById("studentLoginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();


    const studentId =
      document
        .getElementById("studentId")
        .value
        .trim();


    const password =
      document
        .getElementById("studentPassword")
        .value;


    if (!studentId || !password) {

      showMessage(
        "studentMessage",
        "Student ID and password are required.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById("studentLoginButton");

    const loading =
      document.getElementById("studentLoading");


    button.disabled = true;

    loading.style.display = "block";


    showMessage(
      "studentMessage",
      "",
      ""
    );


    try {

      /*
       * IMPORTANT:
       * Backend expects:
       *
       * action: studentLogin
       * studentId: ...
       * password: ...
       */

      const result = await api(
        "studentLogin",
        {
          studentId: studentId,
          password: password
        }
      );


      if (result.success === true) {

        /*
         * Save only the logged-in student's
         * basic information.
         */

        localStorage.setItem(
          "studentId",
          result.student.studentId
        );

        localStorage.setItem(
          "studentName",
          result.student.name
        );


        showMessage(
          "studentMessage",
          "Login successful. Opening Student Dashboard...",
          "success"
        );


        setTimeout(function() {

          window.location.href =
            "student.html";

        }, 500);


      } else {

        showMessage(
          "studentMessage",
          result.message ||
          "Invalid Student ID or password.",
          "error"
        );

      }


    } catch (error) {

      showMessage(
        "studentMessage",
        error.message ||
        "Unable to connect to the server.",
        "error"
      );

    }


    button.disabled = false;

    loading.style.display = "none";

  });


/* =====================================================
   ADMIN LOGIN
===================================================== */

document
  .getElementById("adminLoginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();


    const adminId =
      document
        .getElementById("adminId")
        .value
        .trim();


    const password =
      document
        .getElementById("adminPassword")
        .value;


    if (!adminId || !password) {

      showMessage(
        "adminMessage",
        "Admin ID and password are required.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById("adminLoginButton");

    const loading =
      document.getElementById("adminLoading");


    button.disabled = true;

    loading.style.display = "block";


    showMessage(
      "adminMessage",
      "",
      ""
    );


    try {

      /*
       * Backend expects:
       *
       * action: adminLogin
       * adminId: ...
       * password: ...
       */

      const result = await api(
        "adminLogin",
        {
          adminId: adminId,
          password: password
        }
      );


      if (result.success === true) {

        localStorage.setItem(
          "adminId",
          result.admin.adminId
        );


        showMessage(
          "adminMessage",
          "Login successful. Opening Admin Panel...",
          "success"
        );


        setTimeout(function() {

          window.location.href =
            "admin.html";

        }, 500);


      } else {

        showMessage(
          "adminMessage",
          result.message ||
          "Invalid Admin ID or password.",
          "error"
        );

      }


    } catch (error) {

      showMessage(
        "adminMessage",
        error.message ||
        "Unable to connect to the server.",
        "error"
      );

    }


    button.disabled = false;

    loading.style.display = "none";

  });

</script>

</body>
</html>
