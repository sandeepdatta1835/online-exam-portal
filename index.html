<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Exam Portal - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #eef4ff, #f8fbff);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 900px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  color: #163a70;
  font-size: 32px;
}

.header p {
  margin-top: 8px;
  color: #666;
  font-size: 15px;
}

.login-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}

.login-card {
  background: #fff;
  border-radius: 18px;
  padding: 30px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.10);
  border: 1px solid #e5eaf2;
}

.icon {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 15px;
  font-size: 30px;
}

.student-icon {
  background: #e8f1ff;
}

.admin-icon {
  background: #fff0e5;
}

.login-card h2 {
  text-align: center;
  margin: 5px 0 8px;
  color: #222;
}

.login-card .description {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 22px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
  color: #333;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid #ccd3dd;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
  margin-bottom: 15px;
}

input:focus {
  border-color: #2864d7;
  box-shadow: 0 0 0 3px rgba(40,100,215,0.10);
}

.login-btn {
  width: 100%;
  border: none;
  padding: 13px;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  transition: 0.2s;
}

.student-btn {
  background: #2864d7;
}

.student-btn:hover {
  background: #1e50b1;
}

.admin-btn {
  background: #e67e22;
}

.admin-btn:hover {
  background: #c9650d;
}

.login-btn:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 11px 12px;
  border-radius: 8px;
  font-size: 14px;
  text-align: center;
}

.message.error {
  display: block;
  background: #ffe8e8;
  color: #b42318;
  border: 1px solid #ffcaca;
}

.message.success {
  display: block;
  background: #e8f7ed;
  color: #16733a;
  border: 1px solid #bfe8cd;
}

.footer {
  text-align: center;
  margin-top: 22px;
  color: #888;
  font-size: 13px;
}

@media (max-width: 700px) {

  body {
    padding: 15px;
    align-items: flex-start;
  }

  .container {
    margin-top: 20px;
  }

  .header h1 {
    font-size: 25px;
  }

  .login-grid {
    grid-template-columns: 1fr;
  }

  .login-card {
    padding: 24px 20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Online Exam Portal</h1>
    <p>Login to continue</p>
  </div>

  <div class="login-grid">

    <!-- STUDENT LOGIN -->
    <div class="login-card">

      <div class="icon student-icon">
        🎓
      </div>

      <h2>Student Login</h2>

      <div class="description">
        Login to view your subjects, question papers, submit answer sheets and check results.
      </div>

      <form id="studentLoginForm">

        <label for="studentId">
          Student ID
        </label>

        <input
          type="text"
          id="studentId"
          placeholder="Enter Student ID"
          autocomplete="username"
          required
        >

        <label for="studentPassword">
          Password
        </label>

        <input
          type="password"
          id="studentPassword"
          placeholder="Enter Password"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          class="login-btn student-btn"
          id="studentLoginBtn"
        >
          Login as Student
        </button>

        <div id="studentMessage" class="message"></div>

      </form>

    </div>


    <!-- ADMIN LOGIN -->
    <div class="login-card">

      <div class="icon admin-icon">
        👨‍💼
      </div>

      <h2>Admin Login</h2>

      <div class="description">
        Login to manage students, subjects, question papers, submissions and results.
      </div>

      <form id="adminLoginForm">

        <label for="adminId">
          Admin ID
        </label>

        <input
          type="text"
          id="adminId"
          placeholder="Enter Admin ID"
          autocomplete="username"
          required
        >

        <label for="adminPassword">
          Password
        </label>

        <input
          type="password"
          id="adminPassword"
          placeholder="Enter Password"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          class="login-btn admin-btn"
          id="adminLoginBtn"
        >
          Login as Admin
        </button>

        <div id="adminMessage" class="message"></div>

      </form>

    </div>

  </div>

  <div class="footer">
    Online Exam Portal
  </div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxdzpQvRDFD8aoVanwPostU_19pTIjy_ruHwsLZ8slCjox831OxRNWfH94oXSsV_5ctUA/exec";


/* =========================================================
   API FUNCTION
========================================================= */

async function api(action, data = {}) {

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({
        action: action,
        ...data
      })

    });

    const text = await response.text();

    let result;

    try {
      result = JSON.parse(text);
    } catch (e) {

      console.error("Invalid server response:", text);

      return {
        success: false,
        message: "Invalid response from server."
      };

    }

    return result;

  } catch (error) {

    console.error(error);

    return {
      success: false,
      message: "Unable to connect to server. Please try again."
    };

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(elementId, message, type = "error") {

  const element = document.getElementById(elementId);

  element.textContent = message;

  element.className = "message " + type;

}


/* =========================================================
   STUDENT LOGIN
========================================================= */

document
.getElementById("studentLoginForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const studentId =
    document.getElementById("studentId").value.trim();

  const password =
    document.getElementById("studentPassword").value;

  const button =
    document.getElementById("studentLoginBtn");

  if (!studentId || !password) {

    showMessage(
      "studentMessage",
      "Please enter Student ID and Password.",
      "error"
    );

    return;
  }

  button.disabled = true;
  button.textContent = "Logging in...";

  showMessage(
    "studentMessage",
    "Checking login...",
    "success"
  );

  const result = await api("studentLogin", {

    studentId: studentId,

    password: password

  });


  if (result && result.success) {

    /*
      Store only the login information needed
      by student.html.
    */

    sessionStorage.setItem(
      "examPortalRole",
      "student"
    );

    sessionStorage.setItem(
      "studentId",
      result.studentId || studentId
    );

    sessionStorage.setItem(
      "studentName",
      result.studentName || ""
    );


    showMessage(
      "studentMessage",
      "Login successful. Opening dashboard...",
      "success"
    );


    setTimeout(function() {

      window.location.href = "student.html";

    }, 400);

  } else {

    showMessage(
      "studentMessage",
      result && result.message
        ? result.message
        : "Invalid Student ID or password.",
      "error"
    );

    button.disabled = false;
    button.textContent = "Login as Student";

  }

});


/* =========================================================
   ADMIN LOGIN
========================================================= */

document
.getElementById("adminLoginForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const adminId =
    document.getElementById("adminId").value.trim();

  const password =
    document.getElementById("adminPassword").value;

  const button =
    document.getElementById("adminLoginBtn");

  if (!adminId || !password) {

    showMessage(
      "adminMessage",
      "Please enter Admin ID and Password.",
      "error"
    );

    return;
  }

  button.disabled = true;
  button.textContent = "Logging in...";

  showMessage(
    "adminMessage",
    "Checking login...",
    "success"
  );


  const result = await api("adminLogin", {

    adminId: adminId,

    password: password

  });


  if (result && result.success) {

    sessionStorage.setItem(
      "examPortalRole",
      "admin"
    );

    sessionStorage.setItem(
      "adminId",
      result.adminId || adminId
    );


    showMessage(
      "adminMessage",
      "Login successful. Opening dashboard...",
      "success"
    );


    setTimeout(function() {

      window.location.href = "admin.html";

    }, 400);

  } else {

    showMessage(
      "adminMessage",
      result && result.message
        ? result.message
        : "Invalid Admin ID or password.",
      "error"
    );

    button.disabled = false;
    button.textContent = "Login as Admin";

  }

});


/* =========================================================
   ENTER KEY / AUTO FOCUS
========================================================= */

window.addEventListener("load", function() {

  document.getElementById("studentId").focus();

});

</script>

</body>
</html>
