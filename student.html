<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard - Online Exam Portal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f6fa;
  color: #222;
}

/* HEADER */

.header {
  min-height: 70px;
  background: linear-gradient(135deg,#092b68,#1769e0);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 25px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 3px 12px rgba(0,0,0,0.15);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 11px;
  background: white;
  color: #1769e0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.header-title {
  font-size: 19px;
  font-weight: bold;
}

.header-subtitle {
  font-size: 11px;
  opacity: .8;
  margin-top: 3px;
}

.logout-btn {
  border: 1px solid rgba(255,255,255,.5);
  background: rgba(255,255,255,.12);
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.logout-btn:hover {
  background: rgba(255,255,255,.22);
}


/* MAIN */

.container {
  width: 100%;
  max-width: 1150px;
  margin: auto;
  padding: 25px;
}


/* WELCOME */

.welcome {
  background: linear-gradient(135deg,#ffffff,#f7faff);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
  border-left: 5px solid #1769e0;
}

.welcome h2 {
  margin: 0 0 7px;
  font-size: 24px;
}

.welcome p {
  margin: 0;
  color: #777;
}


/* TABS */

.tabs {
  display: flex;
  gap: 7px;
  background: white;
  padding: 8px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.tab-btn {
  flex: 1;
  border: none;
  background: transparent;
  padding: 12px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  color: #666;
}

.tab-btn.active {
  background: #1769e0;
  color: white;
}


/* SECTIONS */

.section {
  display: none;
}

.section.active {
  display: block;
}


/* CARD */

.card {
  background: white;
  border-radius: 15px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.card h3 {
  margin-top: 0;
}


/* PAPER */

.paper-card {
  border: 1px solid #e0e6ed;
  border-radius: 13px;
  padding: 18px;
  margin-bottom: 14px;
  transition: .2s;
}

.paper-card:hover {
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
  border-color: #b8cdf0;
}

.paper-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.paper-details {
  color: #777;
  font-size: 13px;
  line-height: 1.7;
}

.paper-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}


/* BUTTONS */

.btn {
  border: none;
  padding: 11px 17px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
  text-decoration: none;
  display: inline-block;
}

.btn-primary {
  background: #1769e0;
  color: white;
}

.btn-success {
  background: #198754;
  color: white;
}

.btn-secondary {
  background: #e9edf2;
  color: #333;
}

.btn:hover {
  opacity: .9;
}


/* FILE UPLOAD */

.upload-box {
  border: 2px dashed #c9d3df;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  margin-top: 15px;
  background: #fafcff;
}

.upload-box input {
  max-width: 100%;
}

.selected-files {
  margin-top: 15px;
  text-align: left;
}

.file-row {
  background: white;
  border: 1px solid #e2e7ed;
  padding: 9px;
  border-radius: 7px;
  margin: 5px 0;
  font-size: 13px;
}


/* SUBMISSION */

.submission-box {
  background: #f8fafc;
  border-radius: 10px;
  padding: 15px;
  margin-top: 15px;
}

.status {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: #e8f7ed;
  color: #18733b;
  font-size: 12px;
  font-weight: bold;
}


/* RESULTS */

.result-card {
  border: 1px solid #e0e6ed;
  border-radius: 12px;
  padding: 17px;
  margin-bottom: 12px;
}

.result-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.result-pass {
  color: #16803c;
  font-weight: bold;
}

.result-fail {
  color: #c62828;
  font-weight: bold;
}

.result-info {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}

.result-info div {
  background: #f6f8fb;
  padding: 12px;
  border-radius: 8px;
}

.result-label {
  display: block;
  color: #777;
  font-size: 11px;
  margin-bottom: 4px;
}

.result-value {
  font-weight: bold;
}


/* MESSAGE */

.message {
  display: none;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
  font-size: 13px;
}

.message.success {
  display: block;
  background: #e8f7ed;
  color: #176b38;
}

.message.error {
  display: block;
  background: #fdeaea;
  color: #b42318;
}


/* LOADING */

.loading {
  display: none;
  text-align: center;
  padding: 15px;
  color: #1769e0;
  font-weight: bold;
}


/* EMPTY */

.empty {
  text-align: center;
  padding: 35px 15px;
  color: #888;
}


/* MOBILE */

@media(max-width:700px) {

  .header {
    padding: 10px 12px;
  }

  .header-title {
    font-size: 16px;
  }

  .header-subtitle {
    display: none;
  }

  .logout-btn {
    padding: 8px 11px;
    font-size: 12px;
  }

  .container {
    padding: 12px;
  }

  .tabs {
    overflow-x: auto;
  }

  .tab-btn {
    min-width: 120px;
    flex: none;
  }

  .result-info {
    grid-template-columns: 1fr;
  }

  .welcome h2 {
    font-size: 21px;
  }
}
</style>
</head>


<body>


<!-- =================================================
     HEADER
================================================== -->

<header class="header">

  <div class="header-left">

    <div class="logo">
      🎓
    </div>

    <div>

      <div class="header-title">
        Online Exam Portal
      </div>

      <div class="header-subtitle">
        Student Examination Dashboard
      </div>

    </div>

  </div>


  <button
    class="logout-btn"
    onclick="logout()">

    ⇥ Logout

  </button>

</header>


<div class="container">


<!-- =================================================
     WELCOME
================================================== -->

<div class="welcome">

  <h2>
    Welcome, <span id="studentName">Student</span>
  </h2>

  <p>
    Student ID:
    <strong id="studentIdDisplay"></strong>
  </p>

</div>


<!-- =================================================
     MESSAGE
================================================== -->

<div
  id="message"
  class="message">
</div>


<div
  id="loading"
  class="loading">

  Loading...

</div>


<!-- =================================================
     TABS
================================================== -->

<div class="tabs">

  <button
    class="tab-btn active"
    onclick="showSection('papers',this)">

    Question Papers

  </button>

  <button
    class="tab-btn"
    onclick="showSection('submissions',this)">

    My Submissions

  </button>

  <button
    class="tab-btn"
    onclick="showSection('results',this)">

    My Results

  </button>

</div>


<!-- =================================================
     QUESTION PAPERS
================================================== -->

<section
  id="papers"
  class="section active">

  <div class="card">

    <h3>
      Available Question Papers
    </h3>

    <p style="color:#777;font-size:13px;">
      Only question papers assigned to your subjects
      are displayed here.
    </p>

    <div id="papersList">
    </div>

  </div>

</section>


<!-- =================================================
     SUBMISSIONS
================================================== -->

<section
  id="submissions"
  class="section">

  <div class="card">

    <h3>
      My Answer Sheet Submissions
    </h3>

    <div id="submissionsList">
    </div>

  </div>

</section>


<!-- =================================================
     RESULTS
================================================== -->

<section
  id="results"
  class="section">

  <div class="card">

    <h3>
      My Examination Results
    </h3>

    <div id="resultsList">
    </div>

  </div>

</section>


</div>


<!-- =================================================
     JAVASCRIPT
================================================== -->

<script>


/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxdzpQvRDFD8aoVanwPostU_19pTIjy_ruHwsLZ8slCjox831OxRNWfH94oXSsV_5ctUA/exec";


/* =====================================================
   STUDENT SESSION
===================================================== */

const STUDENT_ID =
sessionStorage.getItem(
  "examStudentId"
);

const STUDENT_PASSWORD =
sessionStorage.getItem(
  "examStudentPassword"
);

const STUDENT_NAME =
sessionStorage.getItem(
  "examStudentName"
);


if (
  !STUDENT_ID ||
  !STUDENT_PASSWORD
) {

  window.location.href =
    "index.html";

}


/* =====================================================
   DISPLAY STUDENT
===================================================== */

document.getElementById(
  "studentName"
).textContent =
  STUDENT_NAME || "Student";


document.getElementById(
  "studentIdDisplay"
).textContent =
  STUDENT_ID || "";


/* =====================================================
   DATA
===================================================== */

let DATA = {

  papers: [],

  submissions: [],

  results: []

};


let selectedPaper = null;

let selectedFiles = [];


/* =====================================================
   API REQUEST
===================================================== */

async function apiRequest(data) {

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)
      }
    );


  const text =
    await response.text();


  try {

    return JSON.parse(text);

  } catch (error) {

    throw new Error(
      "Invalid response from server."
    );

  }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  message,
  type
) {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    message;

  box.className =
    "message " + type;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function clearMessage() {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    "";

  box.className =
    "message";

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(status) {

  document.getElementById(
    "loading"
  ).style.display =
    status
      ? "block"
      : "none";

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

  setLoading(true);

  clearMessage();


  try {

    const papers =
      await apiRequest({

        action:
          "getPapers",

        studentId:
          STUDENT_ID,

        password:
          STUDENT_PASSWORD

      });


    if (!papers.success) {

      showMessage(
        papers.message ||
        "Unable to load question papers.",
        "error"
      );

      return;

    }


    DATA.papers =
      papers.papers || [];


    const results =
      await apiRequest({

        action:
          "getStudentResults",

        studentId:
          STUDENT_ID,

        password:
          STUDENT_PASSWORD

      });


    if (results.success) {

      DATA.results =
        results.results || [];

    }


    renderPapers();

    renderResults();


    /*
      Submissions are not returned by the
      current student API, so they will be
      shown locally after submission.
    */

    renderSubmissions();


  } catch (error) {

    showMessage(
      error.message ||
      "Unable to connect to server.",
      "error"
    );

  } finally {

    setLoading(false);

  }

}


/* =====================================================
   TABS
===================================================== */

function showSection(
  sectionId,
  button
) {

  document
    .querySelectorAll(".section")
    .forEach(function(section) {

      section.classList.remove(
        "active"
      );

    });


  document
    .querySelectorAll(".tab-btn")
    .forEach(function(btn) {

      btn.classList.remove(
        "active"
      );

    });


  document.getElementById(
    sectionId
  ).classList.add(
    "active"
  );


  button.classList.add(
    "active"
  );

}


/* =====================================================
   PAPERS
===================================================== */

function renderPapers() {

  const container =
    document.getElementById(
      "papersList"
    );


  if (!DATA.papers.length) {

    container.innerHTML = `
      <div class="empty">

        <div style="font-size:40px;">
          📄
        </div>

        <p>
          No question papers are currently
          assigned to you.
        </p>

      </div>
    `;

    return;

  }


  container.innerHTML =
    DATA.papers
      .map(function(paper) {

        return `

          <div class="paper-card">

            <div class="paper-title">

              📘
              ${escapeHtml(
                paper.paperTitle
              )}

            </div>


            <div class="paper-details">

              <strong>
                File:
              </strong>

              ${escapeHtml(
                paper.fileName
              )}

              <br>

              <strong>
                Total Marks:
              </strong>

              ${escapeHtml(
                paper.totalMarks
              )}

            </div>


            <div class="paper-actions">

              <a
                class="btn btn-primary"
                href="${escapeAttr(paper.fileUrl)}"
                target="_blank">

                📄 Open Question Paper

              </a>


              <button
                class="btn btn-success"
                onclick="openAnswerUpload('${escapeAttr(paper.paperId)}')">

                📷 Submit Answer Sheet

              </button>

            </div>

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   OPEN ANSWER UPLOAD
===================================================== */

function openAnswerUpload(
  paperId
) {

  const paper =
    DATA.papers.find(
      function(item) {

        return item.paperId
          === paperId;

      }
    );


  if (!paper) {

    showMessage(
      "Question paper not found.",
      "error"
    );

    return;

  }


  selectedPaper =
    paper;


  selectedFiles = [];


  document.getElementById(
    "uploadPaperTitle"
  ).textContent =
    paper.paperTitle;


  document.getElementById(
    "uploadPaperMarks"
  ).textContent =
    "Total Marks: " +
    paper.totalMarks;


  document.getElementById(
    "answerFiles"
  ).value =
    "";


  document.getElementById(
    "selectedFiles"
  ).innerHTML =
    "";


  document.getElementById(
    "uploadPanel"
  ).style.display =
    "block";


  document.getElementById(
    "uploadPanel"
  ).scrollIntoView({
    behavior: "smooth"
  });

}


/* =====================================================
   CLOSE UPLOAD
===================================================== */

function closeUpload() {

  document.getElementById(
    "uploadPanel"
  ).style.display =
    "none";


  selectedPaper =
    null;

  selectedFiles = [];

}


/* =====================================================
   FILE SELECTION
===================================================== */

document
  .getElementById(
    "answerFiles"
  )
  .addEventListener(
    "change",
    function() {

      selectedFiles =
        Array.from(
          this.files
        );


      renderSelectedFiles();

    }
  );


function renderSelectedFiles() {

  const container =
    document.getElementById(
      "selectedFiles"
    );


  if (!selectedFiles.length) {

    container.innerHTML =
      "";

    return;

  }


  container.innerHTML = `

    <strong>
      Selected Pages:
      ${selectedFiles.length}
    </strong>

  `;


  selectedFiles.forEach(
    function(file,index) {

      container.innerHTML += `

        <div class="file-row">

          📄 Page ${index + 1}:

          ${escapeHtml(
            file.name
          )}

          -

          ${(file.size / 1024 / 1024)
            .toFixed(2)} MB

        </div>

      `;

    }
  );

}


/* =====================================================
   SUBMIT ANSWER SHEET
===================================================== */

async function submitAnswerSheet() {

  clearMessage();


  if (!selectedPaper) {

    showMessage(
      "Please select a question paper.",
      "error"
    );

    return;

  }


  if (!selectedFiles.length) {

    showMessage(
      "Please select at least one answer-sheet page.",
      "error"
    );

    return;

  }


  const submitButton =
    document.getElementById(
      "submitAnswerButton"
    );


  submitButton.disabled =
    true;


  setLoading(true);


  try {

    const uploadedUrls = [];


    /*
      Upload every selected page.
    */

    for (
      let i = 0;
      i < selectedFiles.length;
      i++
    ) {

      const file =
        selectedFiles[i];


      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        throw new Error(
          file.name +
          " is not an image file."
        );

      }


      const base64 =
        await fileToBase64(
          file
        );


      const result =
        await apiRequest({

          action:
            "uploadAnswerPhoto",

          studentId:
            STUDENT_ID,

          password:
            STUDENT_PASSWORD,

          paperId:
            selectedPaper.paperId,

          fileName:
            "Answer_" +
            STUDENT_ID +
            "_" +
            selectedPaper.paperId +
            "_Page_" +
            (i + 1) +
            ".jpg",

          base64:
            base64

        });


      if (!result.success) {

        throw new Error(
          result.message ||
          "Unable to upload page " +
          (i + 1)
        );

      }


      uploadedUrls.push(
        result.fileUrl
      );

    }


    /*
      Save submission.
    */

    const submission =
      await apiRequest({

        action:
          "submitAnswer",

        studentId:
          STUDENT_ID,

        password:
          STUDENT_PASSWORD,

        paperId:
          selectedPaper.paperId,

        examName:
          "Online Examination",

        photoUrls:
          uploadedUrls.join(",")

      });


    if (!submission.success) {

      throw new Error(
        submission.message ||
        "Unable to submit answer sheet."
      );

    }


    /*
      Save local submission display.
    */

    const localSubmission = {

      submissionId:
        submission.submissionId,

      paperId:
        selectedPaper.paperId,

      paperTitle:
        selectedPaper.paperTitle,

      pages:
        selectedFiles.length,

      submittedAt:
        new Date(),

      status:
        "Submitted"

    };


    const previous =
      JSON.parse(
        sessionStorage.getItem(
          "myExamSubmissions"
        ) || "[]"
      );


    previous.unshift(
      localSubmission
    );


    sessionStorage.setItem(
      "myExamSubmissions",
      JSON.stringify(previous)
    );


    closeUpload();

    renderSubmissions();


    showMessage(
      "Answer sheet submitted successfully.",
      "success"
    );


    showSection(
      "submissions",
      document.querySelectorAll(
        ".tab-btn"
      )[1]
    );


  } catch (error) {

    showMessage(
      error.message ||
      "Unable to submit answer sheet.",
      "error"
    );

  } finally {

    setLoading(false);

    submitButton.disabled =
      false;

  }

}


/* =====================================================
   SUBMISSIONS
===================================================== */

function renderSubmissions() {

  const container =
    document.getElementById(
      "submissionsList"
    );


  const submissions =
    JSON.parse(
      sessionStorage.getItem(
        "myExamSubmissions"
      ) || "[]"
    );


  if (!submissions.length) {

    container.innerHTML = `
      <div class="empty">

        <div style="font-size:40px;">
          📤
        </div>

        <p>
          You have not submitted any answer sheet
          during this browser session.
        </p>

      </div>
    `;

    return;

  }


  container.innerHTML =
    submissions
      .map(function(item) {

        return `

          <div class="submission-box">

            <strong>
              ${escapeHtml(
                item.paperTitle
              )}
            </strong>

            <br><br>

            Pages Submitted:
            <strong>
              ${item.pages}
            </strong>

            <br>

            Submitted:
            ${formatDate(
              item.submittedAt
            )}

            <br><br>

            <span class="status">
              ✓ ${escapeHtml(
                item.status
              )}
            </span>

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   RESULTS
===================================================== */

function renderResults() {

  const container =
    document.getElementById(
      "resultsList"
    );


  if (!DATA.results.length) {

    container.innerHTML = `
      <div class="empty">

        <div style="font-size:40px;">
          🏆
        </div>

        <p>
          No results have been published yet.
        </p>

      </div>
    `;

    return;

  }


  container.innerHTML =
    DATA.results
      .map(function(result) {

        const pass =
          String(result.result)
            .toLowerCase()
            === "pass";


        return `

          <div class="result-card">

            <div class="result-header">

              <strong>
                Examination Result
              </strong>

              <span
                class="${
                  pass
                    ? "result-pass"
                    : "result-fail"
                }">

                ${escapeHtml(
                  result.result
                )}

              </span>

            </div>


            <div class="result-info">

              <div>

                <span class="result-label">
                  Marks Obtained
                </span>

                <span class="result-value">
                  ${escapeHtml(
                    result.marksObtained
                  )}
                </span>

              </div>


              <div>

                <span class="result-label">
                  Total Marks
                </span>

                <span class="result-value">
                  ${escapeHtml(
                    result.totalMarks
                  )}
                </span>

              </div>


              <div>

                <span class="result-label">
                  Percentage
                </span>

                <span class="result-value">
                  ${escapeHtml(
                    result.percentage
                  )}%
                </span>

              </div>

            </div>


            ${
              result.remarks
                ? `
                  <div
                    style="
                      margin-top:12px;
                      color:#666;
                      font-size:13px;
                    ">

                    <strong>
                      Remarks:
                    </strong>

                    ${escapeHtml(
                      result.remarks
                    )}

                  </div>
                `
                : ""
            }

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   FILE TO BASE64
===================================================== */

function fileToBase64(file) {

  return new Promise(
    function(resolve,reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          const result =
            reader.result;


          const base64 =
            result.split(",")[1];


          resolve(base64);

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Unable to read image."
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value) {

  if (!value) {
    return "-";
  }


  try {

    const date =
      new Date(value);


    if (
      isNaN(
        date.getTime()
      )
    ) {

      return String(value);

    }


    return date.toLocaleString();

  } catch (e) {

    return String(value);

  }

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value) {

  return String(
    value === undefined ||
    value === null
      ? ""
      : value
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(value) {

  return escapeHtml(value);

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

  if (
    !confirm(
      "Are you sure you want to logout?"
    )
  ) {

    return;

  }


  sessionStorage.removeItem(
    "examStudentId"
  );

  sessionStorage.removeItem(
    "examStudentPassword"
  );

  sessionStorage.removeItem(
    "examStudentName"
  );

  sessionStorage.removeItem(
    "myExamSubmissions"
  );


  window.location.href =
    "index.html";

}
