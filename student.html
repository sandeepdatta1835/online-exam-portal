<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard - Online Exam Portal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

.header {
  background: #1565c0;
  color: white;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.header h1 {
  margin: 0;
  font-size: 22px;
}

.student-info {
  text-align: right;
  font-size: 14px;
}

.logout-btn {
  background: #d32f2f;
  color: white;
  border: none;
  padding: 9px 15px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.welcome {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.welcome h2 {
  margin-top: 0;
  color: #1565c0;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h3 {
  margin-top: 0;
  color: #555;
}

.number {
  font-size: 30px;
  font-weight: bold;
  color: #1565c0;
}

.section {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section h2 {
  margin-top: 0;
  color: #1565c0;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 11px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #f1f5f9;
}

.subject-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.subject {
  background: #e3f2fd;
  color: #1565c0;
  padding: 9px 13px;
  border-radius: 20px;
  font-weight: bold;
}

.paper-card {
  border: 1px solid #ddd;
  border-radius: 9px;
  padding: 18px;
  margin-bottom: 15px;
}

.paper-card h3 {
  margin-top: 0;
  color: #1565c0;
}

.paper-info {
  margin: 7px 0;
  color: #555;
}

.open-btn {
  display: inline-block;
  background: #1565c0;
  color: white;
  text-decoration: none;
  padding: 10px 16px;
  border-radius: 6px;
  margin-top: 10px;
  font-weight: bold;
}

.no-data {
  text-align: center;
  color: #777;
  padding: 25px;
}

.loading {
  text-align: center;
  padding: 25px;
  color: #555;
}

.error {
  background: #ffebee;
  color: #c62828;
  padding: 12px;
  border-radius: 6px;
  margin-bottom: 15px;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: bold;
}

.status-live {
  background: #e8f5e9;
  color: #2e7d32;
}

.status-upcoming {
  background: #fff3e0;
  color: #ef6c00;
}

.status-ended {
  background: #ffebee;
  color: #c62828;
}

.refresh-btn {
  background: #455a64;
  color: white;
  border: none;
  padding: 9px 14px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 15px;
}

@media (max-width: 800px) {

  .cards {
    grid-template-columns: 1fr;
  }

  .header {
    flex-direction: column;
    align-items: flex-start;
  }

  .student-info {
    text-align: left;
  }

  table {
    font-size: 13px;
  }

  th,
  td {
    padding: 8px;
  }
}
</style>
</head>

<body>

<!-- ================================
     HEADER
================================ -->

<div class="header">

  <div>
    <h1>Online Exam Portal</h1>
  </div>

  <div class="student-info">

    <div>
      Student:
      <strong id="headerStudentName">Loading...</strong>
    </div>

    <div>
      ID:
      <strong id="headerStudentId">Loading...</strong>
    </div>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>


<!-- ================================
     MAIN
================================ -->

<div class="container">


  <!-- WELCOME -->

  <div class="welcome">

    <h2>
      Welcome,
      <span id="studentName">Student</span>
    </h2>

    <p>
      This is your Student Dashboard.
    </p>

  </div>


  <!-- ERROR -->

  <div
    id="errorBox"
    class="error"
    style="display:none;"
  ></div>


  <!-- SUMMARY -->

  <div class="cards">

    <div class="card">

      <h3>Student ID</h3>

      <div
        class="number"
        id="studentIdDisplay"
        style="font-size:22px;"
      >
        -
      </div>

    </div>


    <div class="card">

      <h3>Assigned Subjects</h3>

      <div
        class="number"
        id="subjectCount"
      >
        0
      </div>

    </div>


    <div class="card">

      <h3>Available Exams</h3>

      <div
        class="number"
        id="paperCount"
      >
        0
      </div>

    </div>

  </div>


  <!-- SUBJECTS -->

  <div class="section">

    <h2>My Subjects</h2>

    <div
      id="subjectsContainer"
      class="loading"
    >
      Loading subjects...
    </div>

  </div>


  <!-- EXAMS -->

  <div class="section">

    <h2>My Question Papers</h2>

    <button
      class="refresh-btn"
      onclick="loadDashboard()"
    >
      Refresh
    </button>

    <div
      id="papersContainer"
    >
      <div class="loading">
        Loading question papers...
      </div>
    </div>

  </div>


  <!-- RESULTS -->

  <div class="section">

    <h2>My Results</h2>

    <div
      id="resultsContainer"
    >
      <div class="loading">
        Loading results...
      </div>
    </div>

  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxdzpQvRDFD8aoVanwPostU_19pTIjy_ruHwsLZ8slCjox831OxRNWfH94oXSsV_5ctUA/exec";


/* =====================================================
   STUDENT INFORMATION
===================================================== */

const studentId =
  localStorage.getItem("studentId");

const studentName =
  localStorage.getItem("studentName");


/* =====================================================
   CHECK LOGIN
===================================================== */

if (!studentId) {

  window.location.href = "index.html";

}


/* =====================================================
   DISPLAY STUDENT
===================================================== */

document.getElementById(
  "headerStudentId"
).textContent = studentId || "-";


document.getElementById(
  "studentIdDisplay"
).textContent = studentId || "-";


document.getElementById(
  "headerStudentName"
).textContent =
  studentName || "Student";


document.getElementById(
  "studentName"
).textContent =
  studentName || "Student";


/* =====================================================
   API FUNCTION
===================================================== */

async function api(action, data = {}) {

  const response = await fetch(API_URL, {

    method: "POST",

    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },

    body: JSON.stringify({

      action: action,

      ...data

    })

  });


  const text =
    await response.text();


  let result;

  try {

    result = JSON.parse(text);

  } catch (error) {

    throw new Error(
      "Invalid response from Google Apps Script."
    );

  }


  return result;

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

function showError(message) {

  const box =
    document.getElementById("errorBox");

  box.textContent = message;

  box.style.display = "block";

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

  document.getElementById(
    "errorBox"
  ).style.display = "none";


  document.getElementById(
    "subjectsContainer"
  ).innerHTML =
    '<div class="loading">Loading subjects...</div>';


  document.getElementById(
    "papersContainer"
  ).innerHTML =
    '<div class="loading">Loading question papers...</div>';


  document.getElementById(
    "resultsContainer"
  ).innerHTML =
    '<div class="loading">Loading results...</div>';


  try {

    const [
      subjectsResult,
      assignmentsResult,
      papersResult,
      resultsResult
    ] = await Promise.all([

      api("getSubjects"),

      api("getAssignments"),

      api("getPapers"),

      api("getResults")

    ]);


    if (!subjectsResult.success) {

      throw new Error(
        subjectsResult.message ||
        "Unable to load subjects."
      );

    }


    if (!assignmentsResult.success) {

      throw new Error(
        assignmentsResult.message ||
        "Unable to load assignments."
      );

    }


    if (!papersResult.success) {

      throw new Error(
        papersResult.message ||
        "Unable to load papers."
      );

    }


    if (!resultsResult.success) {

      throw new Error(
        resultsResult.message ||
        "Unable to load results."
      );

    }


    const allSubjects =
      subjectsResult.subjects || [];


    const allAssignments =
      assignmentsResult.assignments || [];


    const allPapers =
      papersResult.papers || [];


    const allResults =
      resultsResult.results || [];


    /* ================================================
       FIND MY SUBJECTS
    ================================================ */

    const myAssignments =
      allAssignments.filter(function(item) {

        return String(item.studentId).trim() ===
          String(studentId).trim();

      });


    const mySubjectIds =
      myAssignments.map(function(item) {

        return String(item.subjectId).trim();

      });


    const mySubjects =
      allSubjects.filter(function(subject) {

        return mySubjectIds.includes(
          String(subject.subjectId).trim()
        );

      });


    /* ================================================
       DISPLAY SUBJECTS
    ================================================ */

    displaySubjects(mySubjects);


    document.getElementById(
      "subjectCount"
    ).textContent =
      mySubjects.length;


    /* ================================================
       CURRENT DATE/TIME
    ================================================ */

    const now =
      new Date();


    /* ================================================
       MY PAPERS
    ================================================ */

    const myPapers =
      allPapers.filter(function(paper) {

        const subjectId =
          String(paper.subjectId).trim();

        const published =
          String(paper.published)
            .toLowerCase()
            === "yes";

        return (
          mySubjectIds.includes(subjectId) &&
          published
        );

      });


    displayPapers(
      myPapers,
      now
    );


    /* ================================================
       MY RESULTS
    ================================================ */

    const myResults =
      allResults.filter(function(result) {

        return String(result.studentId).trim() ===
          String(studentId).trim();

      });


    displayResults(
      myResults,
      allPapers
    );

  } catch (error) {

    showError(
      error.message ||
      "Unable to load dashboard."
    );


    document.getElementById(
      "subjectsContainer"
    ).innerHTML =
      '<div class="no-data">Unable to load subjects.</div>';


    document.getElementById(
      "papersContainer"
    ).innerHTML =
      '<div class="no-data">Unable to load question papers.</div>';


    document.getElementById(
      "resultsContainer"
    ).innerHTML =
      '<div class="no-data">Unable to load results.</div>';

  }

}


/* =====================================================
   DISPLAY SUBJECTS
===================================================== */

function displaySubjects(subjects) {

  const container =
    document.getElementById(
      "subjectsContainer"
    );


  if (!subjects.length) {

    container.innerHTML =
      '<div class="no-data">' +
      'No subjects have been assigned to you yet.' +
      '</div>';

    return;

  }


  container.className =
    "subject-list";


  container.innerHTML =
    subjects.map(function(subject) {

      const code =
        subject.subjectCode
          ? " (" + escapeHtml(subject.subjectCode) + ")"
          : "";


      return `
        <div class="subject">
          ${escapeHtml(subject.subjectName)}${code}
        </div>
      `;

    }).join("");

}


/* =====================================================
   DISPLAY PAPERS
===================================================== */

function displayPapers(papers, now) {

  const container =
    document.getElementById(
      "papersContainer"
    );


  document.getElementById(
    "paperCount"
  ).textContent =
    papers.length;


  if (!papers.length) {

    container.innerHTML =
      '<div class="no-data">' +
      'No published question papers are currently available.' +
      '</div>';

    return;

  }


  container.innerHTML =
    papers.map(function(paper) {

      const start =
        parseDate(paper.examStart);


      const end =
        parseDate(paper.examEnd);


      let status = "Available";

      let statusClass = "status-live";

      let canOpen = true;


      if (start && now < start) {

        status = "Upcoming";

        statusClass = "status-upcoming";

        canOpen = false;

      }


      if (end && now > end) {

        status = "Exam Ended";

        statusClass = "status-ended";

        canOpen = false;

      }


      const subject =
        escapeHtml(paper.subjectId);


      const startText =
        formatDate(paper.examStart);


      const endText =
        formatDate(paper.examEnd);


      let button = "";


      if (
        canOpen &&
        paper.fileUrl
      ) {

        button =
          `
          <a
            class="open-btn"
            href="${escapeAttribute(paper.fileUrl)}"
            target="_blank"
            rel="noopener"
          >
            Open Question Paper
          </a>
          `;

      } else {

        button =
          `
          <span
            class="status ${statusClass}"
          >
            ${status}
          </span>
          `;

      }


      return `

        <div class="paper-card">

          <h3>
            ${escapeHtml(paper.paperTitle)}
          </h3>

          <div class="paper-info">
            <strong>Paper Code:</strong>
            ${escapeHtml(paper.paperCode)}
          </div>

          <div class="paper-info">
            <strong>Subject:</strong>
            ${subject}
          </div>

          <div class="paper-info">
            <strong>Total Marks:</strong>
            ${escapeHtml(String(paper.totalMarks))}
          </div>

          <div class="paper-info">
            <strong>Exam Start:</strong>
            ${startText}
          </div>

          <div class="paper-info">
            <strong>Exam End:</strong>
            ${endText}
          </div>

          <div class="paper-info">
            <strong>Status:</strong>
            <span class="status ${statusClass}">
              ${status}
            </span>
          </div>

          ${button}

        </div>

      `;

    }).join("");

}


/* =====================================================
   DISPLAY RESULTS
===================================================== */

function displayResults(results, papers) {

  const container =
    document.getElementById(
      "resultsContainer"
    );


  if (!results.length) {

    container.innerHTML =
      '<div class="no-data">' +
      'No results available yet.' +
      '</div>';

    return;

  }


  let html = `

    <div style="overflow-x:auto;">

      <table>

        <thead>

          <tr>
            <th>Paper</th>
            <th>Marks</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Result</th>
            <th>Remarks</th>
          </tr>

        </thead>

        <tbody>

  `;


  results.forEach(function(result) {

    const paper =
      papers.find(function(item) {

        return String(item.paperId).trim() ===
          String(result.paperId).trim();

      });


    const paperName =
      paper
        ? paper.paperTitle
        : result.paperId;


    html += `

      <tr>

        <td>
          ${escapeHtml(paperName)}
        </td>

        <td>
          ${escapeHtml(String(result.marksObtained))}
        </td>

        <td>
          ${escapeHtml(String(result.totalMarks))}
        </td>

        <td>
          ${escapeHtml(String(result.percentage))}%
        </td>

        <td>
          <strong>
            ${escapeHtml(String(result.result))}
          </strong>
        </td>

        <td>
          ${escapeHtml(String(result.remarks || ""))}
        </td>

      </tr>

    `;

  });


  html += `

        </tbody>

      </table>

    </div>

  `;


  container.innerHTML = html;

}


/* =====================================================
   DATE PARSER
===================================================== */

function parseDate(value) {

  if (!value) {
    return null;
  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {

    return null;

  }


  return date;

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value) {

  if (!value) {

    return "Not specified";

  }


  const date =
    parseDate(value);


  if (!date) {

    return escapeHtml(
      String(value)
    );

  }


  return date.toLocaleString();

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   ATTRIBUTE ESCAPE
===================================================== */

function escapeAttribute(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

  localStorage.removeItem(
    "studentId"
  );

  localStorage.removeItem(
    "studentName"
  );


  window.location.href =
    "index.html";

}


/* =====================================================
   START DASHBOARD
===================================================== */

loadDashboard();

</script>

</body>
</html>
