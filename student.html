<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student API Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #263238;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg, #0d47a1, #1976d2);
    color: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 6px;
    font-size: 22px;
}

.header p {
    margin: 0;
    opacity: .9;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
    color: #12395b;
}

input {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border: 1px solid #cbd5df;
    border-radius: 8px;
    font-size: 15px;
    margin: 8px 0 12px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    margin: 4px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: #1976d2;
    color: white;
}

.success {
    background: #2e7d32;
    color: white;
}

.warning {
    background: #ef6c00;
    color: white;
}

.dark {
    background: #37474f;
    color: white;
}

.danger {
    background: #c62828;
    color: white;
}

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
}

.loading {
    background: #fff3e0;
    color: #e65100;
}

.ok {
    background: #e8f5e9;
    color: #2e7d32;
}

.error {
    background: #ffebee;
    color: #c62828;
}

pre {
    background: #111827;
    color: #e5e7eb;
    padding: 15px;
    border-radius: 10px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.5;
}

.paper {
    border: 1px solid #dce5ec;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
    background: #fafcff;
}

.paper div {
    margin: 6px 0;
}

.paper strong {
    display: inline-block;
    min-width: 130px;
}

.info {
    background: #edf6ff;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container">

<header class="header">
    <h1>Online Examination Portal</h1>
    <p>Temporary Student API Diagnostic</p>
</header>


<div class="card">

    <h2>Student ID</h2>

    <div class="info">
        Student ID currently detected:
        <strong id="currentStudentId">Checking...</strong>
    </div>

    <input
        type="text"
        id="studentIdInput"
        placeholder="Enter Student ID"
    >

    <button
        class="primary"
        onclick="saveStudentId()">
        Save Student ID
    </button>

</div>


<div class="card">

    <h2>API Tests</h2>

    <button
        class="primary"
        onclick="testSubjects()">
        Test getSubjects
    </button>

    <button
        class="warning"
        onclick="testAssignments()">
        Test getAssignments
    </button>

    <button
        class="success"
        onclick="testPapers()">
        Test getPapers
    </button>

    <button
        class="dark"
        onclick="runAllTests()">
        Run All Tests
    </button>

    <button
        class="danger"
        onclick="clearResults()">
        Clear
    </button>

    <div id="status"></div>

</div>


<div class="card">

    <h2>Question Papers</h2>

    <div id="paperSummary">
        No test completed yet.
    </div>

    <div id="papersDisplay"></div>

</div>


<div class="card">

    <h2>Raw API Response</h2>

    <h3>getSubjects</h3>
    <pre id="subjectsRaw">No response yet.</pre>

    <h3>getAssignments</h3>
    <pre id="assignmentsRaw">No response yet.</pre>

    <h3>getPapers</h3>
    <pre id="papersRaw">No response yet.</pre>

</div>

</div>


<script>

/* =========================================================
   EXACT SAME API URL AS ADMIN.HTML
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxdzpQvRDFD8aoVanwPostU_19pTIjy_ruHwsLZ8slCjox831OxRNWfH94oXSsV_5ctUA/exec";


let currentStudentId = "";


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        currentStudentId =
            sessionStorage.getItem("studentId") ||
            sessionStorage.getItem("studentID") ||
            sessionStorage.getItem("Student ID") ||
            localStorage.getItem("studentId") ||
            "";

        currentStudentId =
            String(currentStudentId).trim();

        document.getElementById(
            "currentStudentId"
        ).textContent =
            currentStudentId ||
            "No Student ID found";

        document.getElementById(
            "studentIdInput"
        ).value =
            currentStudentId;

    }
);


/* =========================================================
   SAVE STUDENT ID
========================================================= */

function saveStudentId() {

    const id =
        document.getElementById(
            "studentIdInput"
        ).value.trim();

    if (!id) {

        setStatus(
            "Please enter Student ID.",
            "error"
        );

        return;
    }

    currentStudentId = id;

    sessionStorage.setItem(
        "studentId",
        id
    );

    localStorage.setItem(
        "studentId",
        id
    );

    document.getElementById(
        "currentStudentId"
    ).textContent =
        id;

    setStatus(
        "Student ID saved: " + id,
        "ok"
    );

}


/* =========================================================
   EXACT SAME API METHOD AS ADMIN.HTML
========================================================= */

async function api(action, data = {}) {

    const payload = {
        action: action,
        ...data
    };

    console.log(
        "API REQUEST:",
        action,
        payload
    );

    const response =
        await fetch(
            API_URL,
            {
                method: "POST",
                body: JSON.stringify(payload)
            }
        );

    const text =
        await response.text();

    console.log(
        "API RESPONSE:",
        action,
        text
    );

    if (!text) {

        throw new Error(
            "Empty server response."
        );

    }

    let result;

    try {

        result =
            JSON.parse(text);

    } catch(error) {

        console.error(
            "Invalid JSON:",
            text
        );

        throw new Error(
            "Invalid response from server: " +
            text
        );

    }

    if (
        result.success === false
    ) {

        throw new Error(
            result.message ||
            "Request failed."
        );

    }

    return result;

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    message,
    type
) {

    const box =
        document.getElementById(
            "status"
        );

    box.className =
        "status " + type;

    box.textContent =
        message;

}


/* =========================================================
   JSON DISPLAY
========================================================= */

function showJSON(
    elementId,
    data
) {

    document.getElementById(
        elementId
    ).textContent =
        JSON.stringify(
            data,
            null,
            2
        );

}


/* =========================================================
   ARRAY EXTRACTION
========================================================= */

function getArray(
    data,
    key
) {

    if (
        data &&
        Array.isArray(data[key])
    ) {

        return data[key];

    }

    if (
        data &&
        Array.isArray(data.data)
    ) {

        return data.data;

    }

    return [];

}


/* =========================================================
   TEST SUBJECTS
========================================================= */

async function testSubjects() {

    setStatus(
        "Testing getSubjects...",
        "loading"
    );

    try {

        const data =
            await api(
                "getSubjects"
            );

        showJSON(
            "subjectsRaw",
            data
        );

        const subjects =
            getArray(
                data,
                "subjects"
            );

        setStatus(
            "getSubjects completed. Records returned: " +
            subjects.length,
            "ok"
        );

    } catch(error) {

        document.getElementById(
            "subjectsRaw"
        ).textContent =
            error.message;

        setStatus(
            "getSubjects ERROR: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   TEST ASSIGNMENTS
========================================================= */

async function testAssignments() {

    setStatus(
        "Testing getAssignments...",
        "loading"
    );

    try {

        const data =
            await api(
                "getAssignments",
                {
                    studentId:
                        currentStudentId
                }
            );

        showJSON(
            "assignmentsRaw",
            data
        );

        const assignments =
            getArray(
                data,
                "assignments"
            );

        setStatus(
            "getAssignments completed. Records returned: " +
            assignments.length,
            "ok"
        );

    } catch(error) {

        document.getElementById(
            "assignmentsRaw"
        ).textContent =
            error.message;

        setStatus(
            "getAssignments ERROR: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   TEST PAPERS
========================================================= */

async function testPapers() {

    setStatus(
        "Testing getPapers...",
        "loading"
    );

    try {

        const data =
            await api(
                "getPapers"
            );

        showJSON(
            "papersRaw",
            data
        );

        const papers =
            getArray(
                data,
                "papers"
            );

        document.getElementById(
            "paperSummary"
        ).innerHTML =
            "<strong>Records returned:</strong> " +
            papers.length;

        displayPapers(
            papers
        );

        setStatus(
            "getPapers completed. Records returned: " +
            papers.length,
            "ok"
        );

    } catch(error) {

        document.getElementById(
            "papersRaw"
        ).textContent =
            error.message;

        setStatus(
            "getPapers ERROR: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   DISPLAY PAPERS
========================================================= */

function displayPapers(
    papers
) {

    const box =
        document.getElementById(
            "papersDisplay"
        );

    box.innerHTML = "";

    if (!papers.length) {

        box.innerHTML =
            "<div class='status error'>" +
            "No paper records returned by API." +
            "</div>";

        return;

    }

    papers.forEach(
        function(paper, index) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "paper";

            div.innerHTML = `

                <div>
                    <strong>Record:</strong>
                    ${index + 1}
                </div>

                <div>
                    <strong>Paper ID:</strong>
                    ${value(
                        paper["Paper ID"]
                    )}
                </div>

                <div>
                    <strong>Paper Code:</strong>
                    ${value(
                        paper["Paper Code"]
                    )}
                </div>

                <div>
                    <strong>Subject ID:</strong>
                    ${value(
                        paper["Subject ID"]
                    )}
                </div>

                <div>
                    <strong>Paper Title:</strong>
                    ${value(
                        paper["Paper Title"]
                    )}
                </div>

                <div>
                    <strong>Total Marks:</strong>
                    ${value(
                        paper["Total Marks"]
                    )}
                </div>

                <div>
                    <strong>Published:</strong>
                    ${value(
                        paper["Published"]
                    )}
                </div>

                <div>
                    <strong>File URL:</strong>
                    ${value(
                        paper["File URL"]
                    )}
                </div>

                <div>
                    <strong>Exam Start:</strong>
                    ${value(
                        paper["Exam Start"]
                    )}
                </div>

                <div>
                    <strong>Exam End:</strong>
                    ${value(
                        paper["Exam End"]
                    )}
                </div>

            `;

            box.appendChild(div);

        }
    );

}


/* =========================================================
   VALUE
========================================================= */

function value(
    val
) {

    if (
        val === undefined ||
        val === null ||
        val === ""
    ) {

        return "<span style='color:#c62828'>EMPTY</span>";

    }

    return escapeHtml(
        String(val)
    );

}


/* =========================================================
   RUN ALL
========================================================= */

async function runAllTests() {

    clearResults();

    setStatus(
        "Running all tests...",
        "loading"
    );

    await testSubjects();

    await testAssignments();

    await testPapers();

    setStatus(
        "ALL TESTS COMPLETED.",
        "ok"
    );

}


/* =========================================================
   CLEAR
========================================================= */

function clearResults() {

    document.getElementById(
        "subjectsRaw"
    ).textContent =
        "No response yet.";

    document.getElementById(
        "assignmentsRaw"
    ).textContent =
        "No response yet.";

    document.getElementById(
        "papersRaw"
    ).textContent =
        "No response yet.";

    document.getElementById(
        "papersDisplay"
    ).innerHTML =
        "";

    document.getElementById(
        "paperSummary"
    ).textContent =
        "No test completed yet.";

    document.getElementById(
        "status"
    ).innerHTML =
        "";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
