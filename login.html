<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login - Online Exam Portal</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box{
  width:100%;
  max-width:420px;
  margin:20px;
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  margin-bottom:20px;
}

.logo h1{
  margin:0;
  color:#17365d;
  font-size:25px;
}

.logo p{
  margin:7px 0 0;
  color:#666;
  font-size:14px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
  color:#333;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#17365d;
}

button{
  width:100%;
  padding:12px;
  margin-top:20px;
  border:0;
  border-radius:6px;
  background:#17365d;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button:disabled{
  background:#888;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:11px;
  margin-top:15px;
  border-radius:6px;
  font-size:14px;
}

.error{
  background:#f8d7da;
  color:#842029;
}

.success{
  background:#d1e7dd;
  color:#0f5132;
}

.info{
  background:#cff4fc;
  color:#055160;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#777;
}

</style>
</head>

<body>

<div class="login-box">

  <div class="logo">

    <h1>Online Exam Portal</h1>

    <p>Student Login</p>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <label for="studentId">
    Student ID
  </label>

  <input
    type="text"
    id="studentId"
    placeholder="Enter Student ID"
    autocomplete="username"
    autocapitalize="none"
    spellcheck="false"
  >


  <label for="password">
    Password
  </label>

  <input
    type="password"
    id="password"
    placeholder="Enter Password"
    autocomplete="current-password"
  >


  <button
    id="loginButton"
    onclick="studentLogin()"
  >
    Login
  </button>


  <div class="footer">
    Please use the Student ID and Password created by the Admin.
  </div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxdzpQvRDFD8aoVanwPostU_19pTIjy_ruHwsLZ8slCjox831OxRNWfH94oXSsV_5ctUA/exec";


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(message,type){

  const box =
    document.getElementById("message");

  box.textContent = message;

  box.className =
    "message " + type;

  box.style.display = "block";

}


/* =========================================================
   API REQUEST
========================================================= */

async function api(action,data={}){

  const body =
    Object.assign({},data,{
      action:action
    });


  const response =
    await fetch(API_URL,{

      method:"POST",

      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:JSON.stringify(body)

    });


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(text);

  }catch(error){

    throw new Error(
      "Server returned an invalid response."
    );

  }


  if(!result.success){

    throw new Error(
      result.message ||
      "Login failed."
    );

  }


  return result;

}


/* =========================================================
   STUDENT LOGIN
========================================================= */

async function studentLogin(){

  const studentId =
    document
      .getElementById("studentId")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if(!studentId){

    showMessage(
      "Please enter your Student ID.",
      "error"
    );

    return;

  }


  if(!password){

    showMessage(
      "Please enter your Password.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById("loginButton");


  button.disabled = true;

  button.textContent =
    "Logging in...";


  showMessage(
    "Checking Student ID and Password...",
    "info"
  );


  try{

    const result =
      await api("studentLogin",{

        studentId:studentId,

        password:password

      });


    /*
      Save the exact information returned
      by Apps Script.
    */

    sessionStorage.setItem(
      "studentSession",
      result.session || ""
    );


    sessionStorage.setItem(
      "studentId",
      result.studentId || studentId
    );


    sessionStorage.setItem(
      "studentName",
      result.studentName || ""
    );


    showMessage(
      "Login successful. Opening student dashboard...",
      "success"
    );


    /*
      Open student dashboard.
      Change only this filename if your
      dashboard file has a different name.
    */

    setTimeout(function(){

      window.location.href =
        "student.html";

    },500);


  }catch(error){

    showMessage(
      error.message ||
      "Invalid Student ID or Password.",
      "error"
    );


    button.disabled = false;

    button.textContent =
      "Login";

  }

}


/* =========================================================
   ENTER KEY LOGIN
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    document
      .getElementById("studentId")
      .addEventListener(
        "keydown",
        function(event){

          if(event.key === "Enter"){

            document
              .getElementById("password")
              .focus();

          }

        }
      );


    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event){

          if(event.key === "Enter"){

            studentLogin();

          }

        }
      );

  }
);

</script>

</body>
</html>
