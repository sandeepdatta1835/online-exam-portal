<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login | Online Exam Portal</title>

<link rel="stylesheet" href="styles.css">

<style>

/* =====================================================
   LOGIN PAGE
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #eef4ff,
        #f8fafc
    );
}


/* MAIN */

.login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}


/* LOGIN CARD */

.login-card {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 18px;
    padding: 35px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.10);
}


/* LOGO */

.login-logo {
    width: 70px;
    height: 70px;
    border-radius: 18px;
    background: #2563eb;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 18px;
}


.login-title {
    text-align: center;
    margin-bottom: 5px;
    color: #111827;
    font-size: 26px;
}


.login-subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 28px;
}


/* ROLE SWITCH */

.role-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 25px;
    background: #f3f4f6;
    padding: 5px;
    border-radius: 10px;
}


.role-btn {
    border: none;
    padding: 11px;
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
    font-weight: 600;
    color: #6b7280;
}


.role-btn.active {
    background: white;
    color: #2563eb;
    box-shadow:
        0 2px 7px rgba(0,0,0,.08);
}


/* FORM */

.login-form-group {
    margin-bottom: 18px;
}


.login-form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    font-size: 14px;
    color: #374151;
}


.login-form-group input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
}


.login-form-group input:focus {
    border-color: #2563eb;
    box-shadow:
        0 0 0 3px rgba(37,99,235,.10);
}


/* LOGIN BUTTON */

.login-button {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 5px;
}


.login-button:hover {
    background: #1d4ed8;
}


.login-button:disabled {
    opacity: .7;
    cursor: not-allowed;
}


/* ALERT */

.login-alert {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 13px;
    line-height: 1.5;
}


.login-alert.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}


.login-alert.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}


/* FOOTER */

.login-footer {
    text-align: center;
    margin-top: 25px;
    font-size: 12px;
    color: #9ca3af;
}


/* HELP */

.login-help {
    margin-top: 20px;
    padding: 13px;
    background: #f8fafc;
    border-radius: 9px;
    font-size: 12px;
    color: #6b7280;
    line-height: 1.6;
}


/* MOBILE */

@media (max-width: 500px) {

    .login-wrapper {
        padding: 15px;
    }

    .login-card {
        padding: 25px 20px;
    }

    .login-title {
        font-size: 23px;
    }

}

</style>

</head>


<body>


<div class="login-wrapper">

    <div class="login-card">


        <!-- LOGO -->

        <div class="login-logo">
            📚
        </div>


        <h1 class="login-title">
            Online Exam Portal
        </h1>


        <p class="login-subtitle">
            Secure Examination Management System
        </p>


        <!-- ROLE SELECTOR -->

        <div class="role-selector">

            <button
                type="button"
                class="role-btn active"
                id="studentRoleBtn"
                onclick="selectRole('student')"
            >
                👨‍🎓 Student
            </button>


            <button
                type="button"
                class="role-btn"
                id="adminRoleBtn"
                onclick="selectRole('admin')"
            >
                👨‍💼 Admin
            </button>

        </div>


        <!-- ALERT -->

        <div
            id="loginAlert"
            class="login-alert"
        ></div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <div class="login-form-group">

                <label id="idLabel">
                    Student ID
                </label>


                <input
                    type="text"
                    id="userId"
                    placeholder="Enter Student ID"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="login-form-group">

                <label>
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                🔐 Login
            </button>


        </form>


        <!-- HELP -->

        <div
            class="login-help"
            id="loginHelp"
        >

            <strong>Student Login</strong><br>

            Enter your Student ID and password provided by the administrator.

            <br><br>

            Example:
            <strong>STU001</strong>

        </div>


        <!-- FOOTER -->

        <div class="login-footer">

            Online Exam Portal<br>

            Secure Student Examination System

        </div>


    </div>

</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   CURRENT ROLE
===================================================== */

let currentRole = "student";


/* =====================================================
   CHECK URL ROLE
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const requestedRole =
    urlParams.get("role");


if (
    requestedRole === "admin"
) {

    selectRole("admin");

} else {

    selectRole("student");

}


/* =====================================================
   ROLE SELECTION
===================================================== */

window.selectRole =
function(role) {

    currentRole =
        role;


    const studentBtn =
        document.getElementById(
            "studentRoleBtn"
        );


    const adminBtn =
        document.getElementById(
            "adminRoleBtn"
        );


    const idLabel =
        document.getElementById(
            "idLabel"
        );


    const userId =
        document.getElementById(
            "userId"
        );


    const help =
        document.getElementById(
            "loginHelp"
        );


    studentBtn.classList.remove(
        "active"
    );


    adminBtn.classList.remove(
        "active"
    );


    if (role === "student") {

        studentBtn.classList.add(
            "active"
        );


        idLabel.textContent =
            "Student ID";


        userId.placeholder =
            "Enter Student ID";


        help.innerHTML = `

            <strong>Student Login</strong><br>

            Enter your Student ID and password
            provided by the administrator.

            <br><br>

            Example:
            <strong>STU001</strong>

        `;

    } else {

        adminBtn.classList.add(
            "active"
        );


        idLabel.textContent =
            "Admin ID";


        userId.placeholder =
            "Enter Admin ID";


        help.innerHTML = `

            <strong>Admin Login</strong><br>

            Enter your Admin ID and administrator password.

            <br><br>

            Example:
            <strong>ADMIN</strong>

        `;

    }


    userId.value = "";

    hideAlert();

};


/* =====================================================
   LOGIN
===================================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const enteredId =
                document
                    .getElementById(
                        "userId"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            if (!enteredId) {

                showAlert(
                    "Please enter your " +
                    (
                        currentRole === "admin"
                        ? "Admin ID."
                        : "Student ID."
                    ),
                    "error"
                );

                return;

            }


            if (!password) {

                showAlert(
                    "Please enter your password.",
                    "error"
                );

                return;

            }


            const loginButton =
                document.getElementById(
                    "loginButton"
                );


            loginButton.disabled =
                true;


            loginButton.textContent =
                "Logging in...";


            try {


                /* =====================================
                   CREATE INTERNAL FIREBASE EMAIL
                ===================================== */

                let internalEmail;


                if (
                    currentRole ===
                    "admin"
                ) {

                    /*
                     * Admin account:
                     *
                     * ADMIN
                     *
                     * becomes:
                     *
                     * admin@onlineexam.local
                     */

                    internalEmail =
                        enteredId
                            .toLowerCase() +
                        "@onlineexam.local";

                } else {

                    /*
                     * Student account:
                     *
                     * STU001
                     *
                     * becomes:
                     *
                     * stu001@students.onlineexam.local
                     */

                    internalEmail =
                        enteredId
                            .toLowerCase() +
                        "@students.onlineexam.local";

                }


                /* =====================================
                   FIREBASE LOGIN
                ===================================== */

                const credential =
                    await signInWithEmailAndPassword(
                        auth,
                        internalEmail,
                        password
                    );


                const uid =
                    credential.user.uid;


                /* =====================================
                   CHECK FIRESTORE PROFILE
                ===================================== */

                const userRef =
                    doc(
                        db,
                        "users",
                        uid
                    );


                const userSnap =
                    await getDoc(
                        userRef
                    );


                if (!userSnap.exists()) {

                    showAlert(
                        "User account exists, but the profile was not found.",
                        "error"
                    );

                    return;

                }


                const userData =
                    userSnap.data();


                /* =====================================
                   CHECK ROLE
                ===================================== */

                if (
                    userData.role !==
                    currentRole
                ) {

                    showAlert(
                        "This account does not have permission for this login.",
                        "error"
                    );


                    await auth.signOut();

                    return;

                }


                /* =====================================
                   SUCCESS
                ===================================== */

                showAlert(
                    "Login successful. Opening dashboard...",
                    "success"
                );


                setTimeout(
                    () => {

                        if (
                            currentRole ===
                            "admin"
                        ) {

                            window.location.href =
                                "admin.html";

                        } else {

                            window.location.href =
                                "student.html";

                        }

                    },
                    500
                );


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                let message =
                    "Unable to login.";


                switch (
                    error.code
                ) {

                    case
                    "auth/invalid-credential":

                        message =
                            "Incorrect ID or password.";

                        break;


                    case
                    "auth/user-not-found":

                        message =
                            "Account not found. Please check your ID.";

                        break;


                    case
                    "auth/wrong-password":

                        message =
                            "Incorrect password.";

                        break;


                    case
                    "auth/too-many-requests":

                        message =
                            "Too many login attempts. Please try again later.";

                        break;


                    case
                    "auth/network-request-failed":

                        message =
                            "Network error. Please check your internet connection.";

                        break;


                    default:

                        message =
                            error.message ||
                            "Login failed.";

                }


                showAlert(
                    message,
                    "error"
                );


            } finally {

                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "🔐 Login";

            }

        }
    );


/* =====================================================
   ALERT
===================================================== */

function showAlert(
    message,
    type
) {

    const alert =
        document.getElementById(
            "loginAlert"
        );


    alert.textContent =
        message;


    alert.className =
        "login-alert " +
        type;


    alert.style.display =
        "block";

}


/* =====================================================
   HIDE ALERT
===================================================== */

function hideAlert() {

    const alert =
        document.getElementById(
            "loginAlert"
        );


    alert.style.display =
        "none";

}

</script>

</body>
</html>
