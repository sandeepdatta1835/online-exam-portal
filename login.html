<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Online Exam Portal - Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-card {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,.10);
}

.logo {
    width: 70px;
    height: 70px;
    margin: auto;
    border-radius: 18px;
    background: #2563eb;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
}

h1 {
    text-align: center;
    margin: 15px 0 5px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 25px;
}

/* ROLE BUTTONS */

.role-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 25px;
}

.role-button {
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    background: #f8fafc;
    cursor: pointer;
    font-weight: bold;
}

.role-button.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}

label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    margin-bottom: 18px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

.login-button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.login-button:disabled {
    opacity: .6;
}

.message {
    display: none;
    margin-bottom: 18px;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.help {
    margin-top: 20px;
    padding: 12px;
    background: #f8fafc;
    border-radius: 8px;
    font-size: 12px;
    color: #6b7280;
    line-height: 1.6;
}

</style>

</head>


<body>


<div class="login-card">

    <div class="logo">
        📚
    </div>

    <h1>
        Online Exam Portal
    </h1>

    <div class="subtitle">
        Secure Examination Management System
    </div>


    <!-- ROLE SELECTION -->

    <div class="role-buttons">

        <button
            type="button"
            id="studentButton"
            class="role-button"
        >
            👨‍🎓 Student Login
        </button>

        <button
            type="button"
            id="adminButton"
            class="role-button"
        >
            👨‍💼 Admin Login
        </button>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- LOGIN FORM -->

    <form id="loginForm">

        <label id="idLabel">
            Student ID
        </label>

        <input
            type="text"
            id="userId"
            placeholder="Enter Student ID"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
        >


        <button
            type="submit"
            id="loginButton"
            class="login-button"
        >
            Login
        </button>

    </form>


    <div
        id="helpText"
        class="help"
    >
        <strong>Student Login</strong><br>
        Enter the Student ID and password given by the administrator.
        <br><br>
        Example: <strong>STU001</strong>
    </div>

</div>



<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   CURRENT ROLE
===================================================== */

let currentRole = "student";


/* =====================================================
   ELEMENTS
===================================================== */

const studentButton =
    document.getElementById(
        "studentButton"
    );

const adminButton =
    document.getElementById(
        "adminButton"
    );

const idLabel =
    document.getElementById(
        "idLabel"
    );

const userId =
    document.getElementById(
        "userId"
    );

const helpText =
    document.getElementById(
        "helpText"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );


/* =====================================================
   STUDENT LOGIN BUTTON
===================================================== */

studentButton.onclick =
function() {

    currentRole =
        "student";

    studentButton.classList.add(
        "active"
    );

    adminButton.classList.remove(
        "active"
    );

    idLabel.textContent =
        "Student ID";

    userId.placeholder =
        "Enter Student ID";

    helpText.innerHTML = `
        <strong>Student Login</strong><br>
        Enter the Student ID and password
        given by the administrator.
        <br><br>
        Example: <strong>STU001</strong>
    `;

    userId.value = "";

    clearMessage();

};


/* =====================================================
   ADMIN LOGIN BUTTON
===================================================== */

adminButton.onclick =
function() {

    currentRole =
        "admin";

    adminButton.classList.add(
        "active"
    );

    studentButton.classList.remove(
        "active"
    );

    idLabel.textContent =
        "Admin ID";

    userId.placeholder =
        "Enter Admin ID";

    helpText.innerHTML = `
        <strong>Admin Login</strong><br>
        Enter the administrator ID and password.
        <br><br>
        Admin ID: <strong>ADMIN</strong>
    `;

    userId.value = "";

    clearMessage();

};


/* =====================================================
   DEFAULT
===================================================== */

studentButton.classList.add(
    "active"
);


/* =====================================================
   LOGIN
===================================================== */

document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const enteredId =
                userId.value
                    .trim()
                    .toUpperCase();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            if (!enteredId) {

                showMessage(
                    "Please enter your " +
                    (
                        currentRole === "admin"
                        ? "Admin ID."
                        : "Student ID."
                    ),
                    "error"
                );

                return;

            }


            loginButton.disabled =
                true;

            loginButton.textContent =
                "Logging in...";


            try {

                let firebaseEmail;


                /* =================================
                   ADMIN
                ================================= */

                if (
                    currentRole ===
                    "admin"
                ) {

                    if (
                        enteredId !==
                        "ADMIN"
                    ) {

                        throw new Error(
                            "Please use ADMIN as the Admin ID."
                        );

                    }


                    firebaseEmail =
                        "admin@onlineexam.local";

                }


                /* =================================
                   STUDENT
                ================================= */

                else {

                    firebaseEmail =
                        enteredId.toLowerCase() +
                        "@students.onlineexam.local";

                }


                /* =================================
                   FIREBASE AUTH
                ================================= */

                const credential =
                    await signInWithEmailAndPassword(
                        auth,
                        firebaseEmail,
                        password
                    );


                const uid =
                    credential.user.uid;


                /* =================================
                   FIRESTORE USER
                ================================= */

                const userRef =
                    doc(
                        db,
                        "users",
                        uid
                    );


                const userSnapshot =
                    await getDoc(
                        userRef
                    );


                if (
                    !userSnapshot.exists()
                ) {

                    await signOut(auth);

                    throw new Error(
                        "User profile not found in Firestore."
                    );

                }


                const data =
                    userSnapshot.data();


                /* =================================
                   ROLE CHECK
                ================================= */

                if (
                    data.role !==
                    currentRole
                ) {

                    await signOut(auth);

                    throw new Error(
                        "This account does not have the correct login permission."
                    );

                }


                /* =================================
                   SUCCESS
                ================================= */

                showMessage(
                    "Login successful...",
                    "success"
                );


                setTimeout(
                    function() {

                        if (
                            currentRole ===
                            "admin"
                        ) {

                            window.location.href =
                                "admin.html";

                        } else {

                            window.location.href =
                                "student.html";

                        }

                    },
                    700
                );


            } catch(error) {

                console.error(
                    error
                );


                let errorMessage =
                    error.message;


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    errorMessage =
                        "Incorrect ID or password.";

                }


                if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    errorMessage =
                        "Account not found.";

                }


                if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    errorMessage =
                        "Incorrect password.";

                }


                showMessage(
                    errorMessage,
                    "error"
                );


            } finally {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }

        }
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    message,
    type
) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        message;

    box.className =
        "message " +
        type;

}


function clearMessage() {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        "";

    box.className =
        "message";

}

</script>

</body>

</html>
